<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>YouTube 爆款雷達｜2026-09-07</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#f7f8fa;color:#101828;font-family:Arial,'Noto Sans TC',sans-serif;letter-spacing:0}
    .shell{max-width:1120px;margin:0 auto;padding:22px 16px 48px} header{border-top:6px solid #101828;background:#fff;padding:18px 20px;margin-bottom:18px}
    h1{font-size:30px;line-height:1.2;margin:4px 0 8px;letter-spacing:0} .summary{color:#475467;font-size:14px}
    .controls{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px} button{border:1px solid #98a2b3;background:#fff;color:#344054;padding:8px 12px;border-radius:6px;cursor:pointer}
    button[aria-pressed="true"]{background:#101828;color:#fff;border-color:#101828} .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
    .video-card{margin:0!important} .history{font-size:12px;color:#175cd3;margin-top:6px;font-weight:bold} .video-card[hidden]{display:none}
    @media(max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}} @media(max-width:560px){.shell{padding:12px 10px 32px}h1{font-size:24px}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="shell">
    <header><div class="summary">甘丹設計 · 2026-09-07</div><h1>YouTube 爆款雷達</h1><div class="summary">45 天新鮮榜與 365 天年度對標榜，共 0 支合格影片。</div></header>
    <div class="controls" aria-label="榜單篩選">
      <button type="button" data-filter-bucket="all" aria-pressed="true">全部格式</button>
      <button type="button" data-filter-bucket="long" aria-pressed="false">長片</button>
      <button type="button" data-filter-bucket="short" aria-pressed="false">Shorts</button>
      <button type="button" data-filter-window="all" aria-pressed="true">全部時間</button>
      <button type="button" data-filter-window="fresh" aria-pressed="false">45 天新鮮榜</button>
      <button type="button" data-filter-window="annual" aria-pressed="false">365 天年度榜</button>
    </div>
    <section class="grid"></section><p class="empty">本週沒有符合全部門檻的影片。</p>
  </main>
  <script>
    (() => {
      let bucket='all', windowName='all';
      const cards=[...document.querySelectorAll('.video-card')];
      const apply=()=>cards.forEach(card=>{card.hidden=!((bucket==='all'||card.dataset.bucket===bucket)&&(windowName==='all'||card.dataset.window===windowName));});
      document.querySelectorAll('[data-filter-bucket]').forEach(button=>button.addEventListener('click',()=>{bucket=button.dataset.filterBucket;document.querySelectorAll('[data-filter-bucket]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));apply();}));
      document.querySelectorAll('[data-filter-window]').forEach(button=>button.addEventListener('click',()=>{windowName=button.dataset.filterWindow;document.querySelectorAll('[data-filter-window]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));apply();}));
    })();
  </script>
</body>
</html>
